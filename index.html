<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planer domu</title>
  <link rel="stylesheet" href="css/style.css?v=20261102c">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"/><path d="M10 20v-6h4v6"/></svg>
      Planer domu
    </div>
    <input id="proj-name" class="proj-name" title="Nazwa projektu">
    <div class="group">
      <button id="btn-new" title="Nowy projekt">Nowy</button>
      <button id="btn-sample" title="Wczytaj przykładowy dom">Przykład</button>
      <button id="btn-open" title="Otwórz projekt z pliku .json">Otwórz</button>
      <button id="btn-save" title="Zapisz projekt do pliku .json (Ctrl+S)">Zapisz</button>
      <button id="btn-png" title="Zapisz obraz rzutu lub widoku 3D">Obraz PNG</button>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
    </div>
    <div class="group">
      <button id="btn-undo" title="Cofnij (Ctrl+Z)">↶ Cofnij</button>
      <button id="btn-redo" title="Ponów (Ctrl+Y)">↷ Ponów</button>
    </div>
    <div class="spacer"></div>
    <div class="segmented" role="group" aria-label="Widok">
      <button data-view="2d">Rzut 2D</button>
      <button data-view="split">2D + 3D</button>
      <button data-view="3d">Widok 3D</button>
    </div>
  </header>

  <div class="main">
    <aside class="side left">
      <section>
        <h2>Narzędzia</h2>
        <div id="tools" class="tools"></div>
      </section>
      <section>
        <h2>Kondygnacje
          <span class="h-actions">
            <button id="btn-lv-add" class="icon" title="Dodaj piętro na górze">＋</button>
            <button id="btn-lv-del" class="icon" title="Usuń bieżącą kondygnację">－</button>
          </span>
        </h2>
        <div class="lv-head"><span>Rzędna</span><span>Nazwa</span><span>Wys.</span></div>
        <div id="levels" class="levels"></div>
        <label class="attic"><input type="checkbox" id="chk-attic"> Poddasze – dach ścina ściany</label>
        <p id="attic-note" class="muted small"></p>
        <div class="lv-walls">
          <label for="inp-lv-walls" title="Na poddaszu: ścianka kolankowa – dach podnosi się razem ze ścianami">Wysokość ścian</label>
          <input id="inp-lv-walls" type="number" min="-500" max="800" step="5"><span class="unit">cm</span>
        </div>
        <label class="attic" title="Przy zmianie wysokości ścian kalenica zostaje na miejscu, zmienia się spadek dachu"><input type="checkbox" id="chk-keep-ridge"> Zachowaj kalenicę (zmień spadek)</label>
        <div class="lv-walls">
          <label for="inp-lift" title="Podnosi parter i wszystko nad nim (piwnica wychodzi ponad teren). Pokój może zostać przy ziemi – „Podłoga na poziomie terenu” we właściwościach pokoju.">Parter nad terenem</label>
          <input id="inp-lift" type="number" min="0" max="400" step="5"><span class="unit">cm</span>
        </div>
        <button id="btn-lv-basement" class="wide" title="Dodaj kondygnację pod najniższą – poniżej poziomu terenu">Dodaj piwnicę (poniżej)</button>
        <button id="btn-lv-copy" class="wide" title="Skopiuj ściany z kondygnacji poniżej na bieżącą">Kopiuj ściany z niższej</button>
      </section>
    </aside>

    <section id="views" class="views" data-mode="split">
      <div class="pane pane-2d">
        <canvas id="plan" tabindex="0"></canvas>
        <div class="overlay">
          <label class="toggle" title="Rysunek techniczny: biało-czarny, kreskowane ściany i wszystkie wymiary"><input type="checkbox" id="chk-2d-tech"> Rysunek techniczny</label>
          <select id="sel-2d-inst" title="Instalacje w ścianach na rzucie">
            <option value="none">Instalacje: ukryte</option>
            <option value="all">Instalacje: wszystkie</option>
            <option value="el">Instalacja elektryczna</option>
            <option value="wk">Instalacja wod-kan</option>
          </select>
          <label class="toggle" title="Pokaż na rzucie tylko instalacje – ściany i otwory jako jasny podkład, bez mebli, schodów i dachów"><input type="checkbox" id="chk-2d-instonly"> Tylko instalacje</label>
          <label class="toggle" title="Wymiary instalacji: długości przewodów i rur, odległości punktów od ścian, wysokość od podłogi lub sufitu"><input type="checkbox" id="chk-2d-instdims"> Wymiary instalacji</label>
          <button id="btn-fit" title="Dopasuj widok (F)">Dopasuj</button>
        </div>
      </div>
      <div class="pane pane-3d" id="view3d">
        <div class="overlay">
          <select id="sel-3d-show" title="Które kondygnacje pokazać w 3D">
            <option value="all">Cały dom</option>
            <option value="upto">Do bieżącej kondygnacji</option>
            <option value="only">Tylko bieżąca kondygnacja</option>
          </select>
          <label class="toggle" title="Pokaż dachy w widoku 3D"><input type="checkbox" id="chk-3d-roof"> Dach</label>
          <select id="sel-3d-inst" title="Prześwietl ściany i pokaż przewody i rury w ich wnętrzu">
            <option value="none">Instalacje w ścianach: ukryte</option>
            <option value="all">Instalacje: wszystkie</option>
            <option value="el">Instalacja elektryczna</option>
            <option value="wk">Instalacja wod-kan</option>
          </select>
          <label class="toggle" title="Pokaż tylko instalacje – budynek jako przezroczysty szkic, bez mebli, schodów i dachów"><input type="checkbox" id="chk-3d-instonly"> Tylko instalacje</label>
          <button id="btn-3d-pick" title="Klikaj elementy w 3D, aby je zaznaczyć i edytować">Zaznaczanie</button>
          <button id="btn-3d-frame" title="Widok perspektywiczny">Perspektywa</button>
          <button id="btn-3d-top" title="Widok z góry">Z góry</button>
          <button id="btn-walk-exit" class="walk-exit" title="Wróć do widoku z zewnątrz (Esc)" hidden>Zakończ spacer</button>
        </div>
        <div class="pegman" id="pegman" title="Spacer: przeciągnij ludzika do pokoju albo na działkę, aby zobaczyć wnętrze jego oczami (kliknięcie – w środek widoku)">
          <svg viewBox="0 0 24 40" width="22" height="36" aria-hidden="true">
            <circle cx="12" cy="6" r="5"/>
            <path d="M5 14q0-2 2-2h10q2 0 2 2v11q0 1.5-1.5 1.5H17V38q0 1.5-1.5 1.5h-1.6q-1.4 0-1.4-1.5V29h-1v9q0 1.5-1.4 1.5H8.5Q7 39.5 7 38V26.5h-.5Q5 26.5 5 25z"/>
          </svg>
        </div>
        <div class="hint3d" id="hint3d">Lewy przycisk – obrót · prawy – przesuw · kółko – zoom</div>
      </div>
    </section>

    <aside class="side right">
      <section>
        <h2>Właściwości</h2>
        <div id="props"></div>
      </section>
      <section>
        <h2>Ustawienia projektu</h2>
        <div id="settings"></div>
      </section>
    </aside>
  </div>

  <footer class="status">
    <span id="st-coords" class="coords"></span>
    <span id="st-hint" class="hint"></span>
    <span id="st-zoom" class="zoom"></span>
  </footer>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/vendor/OrbitControls.js"></script>
  <script src="js/model.js?v=20261102c"></script>
  <script src="js/vendor/GLTFLoader.js"></script>
  <script src="js/furniture.js?v=20261102c"></script>
  <script src="js/installs.js?v=20261102c"></script>
  <script src="js/site.js?v=20261102c"></script>
  <script src="js/editor2d.js?v=20261102c"></script>
  <script src="js/view3d.js?v=20261102c"></script>
  <script src="js/ui.js?v=20261102c"></script>
  <script src="js/main.js?v=20261102c"></script>
</body>
</html>
